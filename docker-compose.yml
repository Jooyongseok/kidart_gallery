services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kidart
      POSTGRES_USER: kidart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kidart_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidart"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8200:8200"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://kidart:${DB_PASSWORD:-kidart_dev_password}@db:5432/kidart
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./public:/usr/share/nginx/html/public:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
