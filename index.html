<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>KidArt Gallery — 어린이 미술 전시 플랫폼</title>
  <meta name="description" content="어린이들의 미술 작품을 3D 갤러리에서 감상하고, AI로 동화와 3D 작품으로 변환하는 플랫폼" />

  <!-- Preconnect for perf -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: Space Grotesk (display) + Noto Sans KR (body) -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/style.css" />

  <!-- Prevent FOUC: apply saved theme immediately -->
  <script>
    (function(){
      const saved = localStorage.getItem('kidart-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
  <div id="app">
    <nav id="navbar"></nav>
    <main id="page-content"></main>
  </div>

  <!-- Three.js CDN (async, non-blocking) -->
  <script async src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script type="module" src="src/main.js?v=7"></script>
</body>
</html>
